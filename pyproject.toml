"tests/unit/test_task_manager_ui_integration.py" = ["TID251"]
"tests/test_ui_feedback_catalog.py" = ["PLR0915"]

[tool.pyrefly]
project-includes = [
    "src/**/*.py",
    "tests/**/*.py",
]

[tool.pyrefly.errors]
bad-override-param-name = false

[tool.pytest.ini_options]
pythonpath = ["src"]
