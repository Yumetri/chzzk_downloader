"src/chzzk_downloader/core/settings_manager.py" = ["BLE001"]
"src/chzzk_downloader/core/ytdlp.py" = ["BLE001", "C901", "S110"]
"src/chzzk_downloader/gui/feedback_showcase.py" = ["PLR0915"]
