[project]
name = "chzzk-downloader"
version = "0.1.0"
description = "치지직 통합 녹화·VOD 다운로더"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7.0",
    "pyqt6-webengine>=6.11.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
chzzk-downloader = "chzzk_downloader.main:main"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N999"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.pyrefly.errors]
bad-override-param-name = false
