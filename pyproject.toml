[project]
name = "chzzk-downloader"
version = "0.1.0"
description = "치지직 통합 녹화·VOD 다운로더"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7.0",
    "pyqt6-webengine>=6.11.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
chzzk-downloader = "chzzk_downloader.main:main"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B", "BLE", "S110", "C90", "PLR0912", "PLR0915", "TID"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"PyQt6.sip.isdeleted".msg = "AGENTS.md R3: 위젯이 비동기 시그널을 직접 받지 않게 설계하세요."
"time.sleep".msg = "AGENTS.md T: 테스트는 qtbot.waitUntil/waitSignal을 쓰세요. (src에서 필요하면 이 파일에서 예외 처리)"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N999"]
# --- LEGACY: 아래 목록은 줄이기만 한다. 새 파일을 추가하지 않는다 (AGENTS.md §0) ---
