"src/chzzk_downloader/gui/naver_login_dialog.py" = ["BLE001", "S110"]
"src/chzzk_downloader/gui/settings_window.py" = ["BLE001", "PLR0915"]
"src/chzzk_downloader/gui/task_card.py" = ["BLE001", "C901", "PLR0912", "PLR0915", "S110", "TID251"]
"src/chzzk_downloader/gui/task_info_window.py" = ["BLE001", "C901", "PLR0912", "PLR0915", "TID251"]
"src/chzzk_downloader/gui/toast.py" = ["C901"]
"src/chzzk_downloader/gui/workers.py" = ["BLE001", "C901", "S110"]
"tests/test_T0105_cancel_and_duplicate_handling.py" = ["TID251"]
"tests/test_T0106_merge_blocker_edge_cases.py" = ["TID251"]
"tests/test_T0110_ffmpeg_verification.py" = ["TID251"]
"tests/test_pr8_review_defect_fixes.py" = ["TID251"]
